[package]
name = "fan-composer"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
description = "Local adaptive fan soundscapes for Windows"
license = "MIT"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "canvas", "tokio"] }
cpal = "0.18.2"
rustfft = "6.4.1"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hound = "3.5.1"
libloading = "0.9.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
